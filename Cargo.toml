[package]
name = "jaydb2"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Development-only OS fault/barrier hooks; absent from normal builds.
storage-fault-injection = []

[[bin]]
name = "jaydb2"
path = "server/main.rs"

[dependencies]
libc = "=0.2.191"
serde_json = "1.0.151"
sha2 = "0.10.9"
