<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prepared read latency</title>
<style>
:root { --viz-series-1: var(--chart-1); --viz-series-2: var(--chart-2); }
html, body { margin: 0; background: transparent; color: var(--foreground); font-family: var(--font-sans); }
figure { margin: 0; }
svg { display: block; width: 100%; height: 235px; }
svg text { fill: var(--foreground); font-size: 12px; }
.caption { color: var(--muted-foreground); }
</style></head>
<body><figure id="bench-latency">
<figcaption>Prepared read latency · 8 rows · 1 CPU worker · 7 samples per build</figcaption>
<svg role="img" aria-label="Individual request latencies and median for anchor and preprocessing builds"></svg>
<div class="caption">Dots: complete requests. Vertical marks: medians. Two warmup rounds excluded.</div>
</figure>
<script>
const results = [{"label": "Anchor", "samples_ms": [8.037258, 12.368757, 11.545324, 24.242824, 25.746789, 16.76924, 20.499588], "median_ms": 16.76924}, {"label": "Preproc.", "samples_ms": [7.219929, 7.103799, 9.442227, 12.866691, 19.527648, 18.598602, 10.557417], "median_ms": 10.557417}];
const root = document.getElementById('bench-latency');
const svg = root.querySelector('svg');
const ns = 'http://www.w3.org/2000/svg';
function node(tag, attrs, label) {
  const el = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
  if (label !== undefined) el.textContent = label;
  svg.appendChild(el); return el;
}
function draw() {
  svg.replaceChildren();
  const width = root.clientWidth, left = 82, right = width - 12;
  svg.setAttribute('viewBox', `0 0 ${width} 235`);
  const max = Math.max(...results.flatMap(r => r.samples_ms)) * 1.08;
  const x = value => left + (right-left)*value/max;
  node('rect', {x:left, y:24, width:right-left, height:153, fill:'none', stroke:'var(--border)', 'data-chart-frame':''});
  node('text', {x:0, y:15, class:'axis-title', 'data-axis':'y'}, 'Build');
  for (let i=0; i<4; i++) {
    const value = max*i/3, px = x(value);
    node('line', {x1:px, x2:px, y1:177, y2:182, stroke:'var(--border)'});
    node('text', {x:px, y:199, 'text-anchor':i===0?'start':i===3?'end':'middle'}, value.toFixed(1));
  }
  node('text', {x:(left+right)/2, y:224, 'text-anchor':'middle', class:'axis-title', 'data-axis':'x'}, 'Complete request latency (ms)');
  results.forEach((r, index) => {
    const y = 67 + index*74, color = `var(--viz-series-${index+1})`;
    node('text', {x:0, y:y+4}, r.label);
    r.samples_ms.forEach((value, i) => {
      const py = y + ((i%3)-1)*6;
      const group = node('g', {'aria-label':`${r.label}, sample ${i+1}, ${value.toFixed(3)} ms`});
      const title = document.createElementNS(ns,'title');
      title.textContent = `${r.label} · sample ${i+1}: ${value.toFixed(3)} ms`; group.appendChild(title);
      const hit = document.createElementNS(ns,'circle');
      for(const [k,v] of Object.entries({cx:x(value),cy:py,r:16,fill:'transparent','data-chart-hit':''})) hit.setAttribute(k,v);
      group.appendChild(hit);
      const mark = document.createElementNS(ns,index===0?'circle':'rect');
      const attrs = index===0?{cx:x(value),cy:py,r:4}:{x:x(value)-4,y:py-4,width:8,height:8};
      for(const [k,v] of Object.entries({...attrs,fill:color,'pointer-events':'none'})) mark.setAttribute(k,v);
      group.appendChild(mark);
    });
    node('line', {x1:x(r.median_ms),x2:x(r.median_ms),y1:y-15,y2:y+15,stroke:color,'stroke-width':2});
    node('text', {x:left+6,y:y-24}, `Median ${r.median_ms.toFixed(3)} ms`);
  });
}
new ResizeObserver(draw).observe(root);
</script></body></html>
