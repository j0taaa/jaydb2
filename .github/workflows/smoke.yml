name: Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.19.0
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install client development dependencies
        run: npm ci --prefix clients/typescript
      - name: Install the pinned tools needed by host option tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/bootstrap.sh
      - name: Run smoke checks
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: bash tools/ci/check.sh smoke
